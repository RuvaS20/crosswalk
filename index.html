<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Curriculum Crosswalk — Technovation session planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,500;0,600;0,700;1,600&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="chips" id="chips" role="group" aria-label="Current selections"></div>

<div class="wrap">

  <div class="printhead" id="printhead" aria-hidden="true"></div>

  <header>
    <div class="brandmark">
      <img class="logo" src="technovation_logo_svg.svg" alt="" width="26" height="26">
      <span>Technovation</span>
    </div>
    <h1>Technovation <em>session planner</em></h1>
    <p>Tell us how much time your group actually has. You'll get the lessons to cover each week.</p>
    <div class="deadline">Submissions close <b class="mono">5 May 2027</b></div>
  </header>

  <div class="layout">

    <form class="panel" id="controls">
      <div class="field">
        <label id="l-age">Age group</label>
        <div class="seg" role="radiogroup" aria-labelledby="l-age">
          <input type="radio" name="age" id="a1" value="beginner"><label for="a1">8–12</label>
          <input type="radio" name="age" id="a2" value="junior"><label for="a2">13–15</label>
          <input type="radio" name="age" id="a3" value="senior" checked><label for="a3">16–18</label>
        </div>
      </div>

      <div class="field time">
        <label>Time available</label>
        <div class="nums">
          <div><input type="number" id="weeks" value="20" min="1" max="52" aria-label="Number of weeks">
            <p class="hint">weeks</p></div>
          <div><input type="number" id="len" value="90" min="15" max="300" step="5" aria-label="Minutes per session">
            <p class="hint">minutes each</p></div>
        </div>
      </div>

      <div class="field">
        <label id="l-plat">What they'll build</label>
        <div class="seg" role="radiogroup" aria-labelledby="l-plat">
          <input type="radio" name="platform" id="p1" value="mobile" checked><label for="p1">Mobile app</label>
          <input type="radio" name="platform" id="p2" value="web"><label for="p2">Web app</label>
        </div>
        <p class="hint" id="platHint"></p>
      </div>

      <div class="field" id="builderField" hidden>
        <label id="l-build">Coding tool</label>
        <div class="seg" id="builderSeg" role="radiogroup" aria-labelledby="l-build"></div>
      </div>

      <div class="field">
        <label id="l-ai">AI</label>
        <div class="seg" role="radiogroup" aria-labelledby="l-ai">
          <input type="radio" name="aiMode" id="m1" value="none"><label for="m1">None</label>
          <input type="radio" name="aiMode" id="m2" value="integrated" checked><label for="m2">Included</label>
          <input type="radio" name="aiMode" id="m3" value="focused"><label for="m3">AI-focused</label>
        </div>
      </div>

      <div class="field">
        <label class="corechk">
          <input type="checkbox" id="core">
          Use the Core Curriculum (short on time)
        </label>
      </div>

    </form>

    <div class="results">
      <div class="bar">
        <div class="legend" id="legend" hidden>
          <span><i class="k-class"></i>Lesson week</span>
          <span><i class="k-locked"></i>Videos &amp; submission</span>
          <span><i class="k-slack"></i>Work time</span>
        </div>
        <div class="actions" id="actions" hidden>
          <button type="button" id="printBtn">Print</button>
          <button type="button" id="csvBtn">Spreadsheet</button>
        </div>
      </div>
      <main id="out" aria-live="polite" tabindex="-1"></main>
    </div>

  </div>
</div>

<script type="module" src="./app.js"></script>
</body>
</html>
